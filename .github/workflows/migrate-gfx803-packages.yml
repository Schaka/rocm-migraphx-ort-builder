name: Migrate gfx803 packages (one-off)

# Copies the rocm-gfx803-* tags into the shared packages, where gfx803 is now
# just another arch tag (see gfx803-component.yml). Runs on a runner rather than
# a workstation because crane cross-repo-mounts blobs within ghcr.io: the layers
# never leave the registry, so a ~50GB migration costs a few manifest PUTs.
# Delete this workflow once the old packages are gone.

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Only print what would be copied'
        type: boolean
        required: false
        default: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: imjasonh/setup-crane@v0.4

      - run: crane auth login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}

      # src:tag dst:tag, one pair per line. The final image's :latest/:<date>
      # become :latest-gfx803/:<date>-gfx803 to match the main tag scheme; the
      # intermediates and their build caches keep the tag they already had.
      - env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner="ghcr.io/${OWNER,,}"
          pairs="
          rocm-gfx803-rocblas-builder:gfx803        rocm-rocblas-builder:gfx803
          rocm-gfx803-rocblas-builder:cache-gfx803  rocm-rocblas-builder:cache-gfx803
          rocm-gfx803-migraphx-builder:gfx803       rocm-migraphx-builder:gfx803
          rocm-gfx803-migraphx-builder:cache-gfx803 rocm-migraphx-builder:cache-gfx803
          rocm-gfx803-torch-builder:gfx803          rocm-migraphx-torch-builder:gfx803
          rocm-gfx803-torch-builder:cache-gfx803    rocm-migraphx-torch-builder:cache-gfx803
          rocm-gfx803-ort-builder:gfx803            rocm-migraphx-ort-builder:gfx803
          rocm-gfx803-ort-builder:cache-gfx803      rocm-migraphx-ort-builder:cache-gfx803
          rocm-gfx803-ort-torch-builder:latest      rocm-migraphx-ort-torch-builder:latest-gfx803
          rocm-gfx803-ort-torch-builder:20260729    rocm-migraphx-ort-torch-builder:20260729-gfx803
          rocm-gfx803-ort-torch-builder:20260728    rocm-migraphx-ort-torch-builder:20260728-gfx803
          rocm-gfx803-ort-torch-builder:20260725    rocm-migraphx-ort-torch-builder:20260725-gfx803
          rocm-gfx803-ort-torch-builder:cache-gfx803 rocm-migraphx-ort-torch-builder:cache-gfx803
          "

          echo "$pairs" | while read -r src dst; do
            [ -n "${src:-}" ] || continue
            echo "::group::${src} -> ${dst}"
            if [ "${{ inputs.dry-run }}" = "true" ]; then
              echo "would copy ${owner}/${src} -> ${owner}/${dst}"
              crane manifest "${owner}/${src}" > /dev/null && echo "source resolves OK"
            else
              crane copy "${owner}/${src}" "${owner}/${dst}"
            fi
            echo "::endgroup::"
          done

      # Digest equality is the only proof the copy is faithful -- crane copy is
      # digest-preserving, so any mismatch means the wrong thing landed.
      - if: ${{ !inputs.dry-run }}
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner="ghcr.io/${OWNER,,}"
          fail=0
          check() {
            a="$(crane digest "${owner}/$1")"
            b="$(crane digest "${owner}/$2")"
            if [ "$a" = "$b" ]; then echo "OK   $1 == $2  ($a)"; else echo "FAIL $1 ($a) != $2 ($b)"; fail=1; fi
          }
          check rocm-gfx803-rocblas-builder:gfx803         rocm-rocblas-builder:gfx803
          check rocm-gfx803-rocblas-builder:cache-gfx803   rocm-rocblas-builder:cache-gfx803
          check rocm-gfx803-migraphx-builder:gfx803        rocm-migraphx-builder:gfx803
          check rocm-gfx803-migraphx-builder:cache-gfx803  rocm-migraphx-builder:cache-gfx803
          check rocm-gfx803-torch-builder:gfx803           rocm-migraphx-torch-builder:gfx803
          check rocm-gfx803-torch-builder:cache-gfx803     rocm-migraphx-torch-builder:cache-gfx803
          check rocm-gfx803-ort-builder:gfx803             rocm-migraphx-ort-builder:gfx803
          check rocm-gfx803-ort-builder:cache-gfx803       rocm-migraphx-ort-builder:cache-gfx803
          check rocm-gfx803-ort-torch-builder:latest       rocm-migraphx-ort-torch-builder:latest-gfx803
          check rocm-gfx803-ort-torch-builder:20260729     rocm-migraphx-ort-torch-builder:20260729-gfx803
          check rocm-gfx803-ort-torch-builder:20260728     rocm-migraphx-ort-torch-builder:20260728-gfx803
          check rocm-gfx803-ort-torch-builder:20260725     rocm-migraphx-ort-torch-builder:20260725-gfx803
          check rocm-gfx803-ort-torch-builder:cache-gfx803 rocm-migraphx-ort-torch-builder:cache-gfx803
          exit $fail
