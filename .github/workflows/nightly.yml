name: Nightly build

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      arch:
        description: 'Single gfx arch to build (e.g. gfx1201). Leave empty for the full nightly matrix.'
        required: false
        default: ''
      migraphx-ref:
        description: 'Git ref to build MIGraphX from (branch/tag), e.g. release/rocm-rel-7.14. Leave as develop for the normal nightly build.'
        required: false
        default: 'develop'
      debug:
        description: 'Open an SSH debug session (tmate) into the runner for the duration of the build'
        type: boolean
        required: false
        default: false

# The actual per-arch chain lives in build-pipeline.yml, one full run of which is
# matrixed per arch here. Each arch's pipeline is a separate reusable-workflow
# call, so arches run fully independently -- one arch's migraphx build never
# blocks another arch's ort/final.
jobs:
  # Builds and publishes our own self-built ROCm base (the `rocm-base` bake
  # target, tracking TheRock's nightly .deb feed) BEFORE the arch matrix, not
  # per-arch -- it's arch-independent (one image covers every gfx target), and
  # running it once here means a broken base build fails fast instead of being
  # silently rebuilt (and re-failing) inside every one of the ~26 per-arch
  # pipeline runs below. `build` depends on this job, so a failure here stops the
  # whole nightly run before the matrix ever starts.
  rocm-base:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      base-image: ${{ steps.build.outputs.base-image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare runner
        uses: ./.github/actions/prepare-runner
        with:
          # Nothing here compiles; it is an apt install and a symlink dance.
          swap-size-gb: '0'
          registry-username: ${{ secrets.GHCR_PAT != '' && github.repository_owner || github.actor }}
          registry-password: ${{ secrets.GHCR_PAT != '' && secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Build and push rocm-base
        id: build
        env:
          OWNER: ${{ github.repository_owner }}
          REGISTRY_CACHE: 'true'
          CACHE_TARGET: rocm-base
        run: |
          set -euo pipefail
          export OWNER="${OWNER,,}"
          export DATE
          DATE="$(date -u +%Y%m%d)"
          export SOURCE_DATE="$DATE"

          docker buildx bake --print rocm-base
          source scripts/lib/bake-retry.sh
          bake_push_with_retry rocm-base

          # Read the tag back out of the resolved graph rather than re-deriving
          # it, so the matrix below can only ever consume what was just pushed.
          base_image="$(docker buildx bake --print rocm-base \
            | jq -r '.target["rocm-base"].tags[] | select(endswith(":latest"))')"
          echo "base-image=${base_image}" >> "$GITHUB_OUTPUT"

  set-matrix:
    runs-on: ubuntu-latest
    outputs:
      arches: ${{ steps.m.outputs.arches }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        uses: ./.github/actions/arch-matrix
        with:
          arch: ${{ github.event.inputs.arch }}

  build:
    needs: [set-matrix, rocm-base]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.set-matrix.outputs.arches) }}
    uses: ./.github/workflows/build-pipeline.yml
    secrets: inherit
    with:
      arch: ${{ matrix.arch }}
      base-image: ${{ needs.rocm-base.outputs.base-image }}
      migraphx-ref: ${{ github.event_name == 'workflow_dispatch' && inputs.migraphx-ref || 'develop' }}
      # Nightly means fully floating: pytorch version and ROCm release must be
      # passed as an explicit empty string, not omitted -- omitting them would
      # inherit build-component.yml's own default. See
      # torch-package-build-decide.sh's header comment and README.md for the
      # nightly-discovery background.
      pytorch-version: ''
      rocm-release: ''
      use-prebuilt: true
      debug: ${{ github.event_name == 'workflow_dispatch' && inputs.debug }}
