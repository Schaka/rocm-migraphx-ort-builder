name: Nightly build

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      arch:
        description: 'Single gfx arch to build (e.g. gfx1201). Leave empty for the full nightly matrix.'
        required: false
        default: ''
      migraphx-ref:
        description: 'Git ref to build MIGraphX from (branch/tag), e.g. release/rocm-rel-7.14. Leave as develop for the normal nightly build.'
        required: false
        default: 'develop'
      debug:
        description: 'Open an SSH debug session (tmate) into the runner for the duration of the build'
        type: boolean
        required: false
        default: false

# The actual migraphx -> ort -> final chain (plus the independent pytorch
# build) lives in build-pipeline.yml, one full run of which is matrixed per
# arch here. Each arch's pipeline is a separate reusable-workflow call, so
# arches run fully independently of each other -- one arch's migraphx build
# never blocks another arch's ort/final.
jobs:
  set-matrix:
    runs-on: ubuntu-latest
    outputs:
      arches: ${{ steps.set.outputs.arches }}
    steps:
      - id: set
        run: |
          # gfx803 shares this pipeline's packages but not its Dockerfile: it is
          # built from gfx803/Dockerfile.gfx803 on a ROCm 6.4.x base by
          # gfx803.yml, because ROCm 7 can't enumerate Polaris at all. Letting
          # it through here would build the 7.14 Dockerfile for it and overwrite
          # the good gfx803 tags with something that can't run.
          if [ "${{ github.event.inputs.arch }}" = "gfx803" ]; then
            echo "gfx803 is not built by this workflow -- run 'Build gfx803 (Polaris)' instead." >&2
            exit 1
          fi
          if [ -n "${{ github.event.inputs.arch }}" ]; then
            echo "arches=[\"${{ github.event.inputs.arch }}\"]" >> "$GITHUB_OUTPUT"
          else
            echo 'arches=["gfx900","gfx906","gfx908","gfx90a","gfx942","gfx1030","gfx1100","gfx1101","gfx1102","gfx1150","gfx1151","gfx1200","gfx1201"]' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: set-matrix
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.set-matrix.outputs.arches) }}
    uses: ./.github/workflows/build-pipeline.yml
    secrets: inherit
    with:
      arch: ${{ matrix.arch }}
      migraphx-ref: ${{ github.event_name == 'workflow_dispatch' && inputs.migraphx-ref || 'develop' }}
      debug: ${{ github.event_name == 'workflow_dispatch' && inputs.debug }}
