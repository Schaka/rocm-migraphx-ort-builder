name: Build pipeline (single arch)

# Runs the full [rocblas ->] migraphx -> ort -> final chain for ONE arch, plus
# the parallel [rocblas ->] pytorch -> {torchvision, torchaudio} -> final chain,
# which is independent of MIGraphX. Called once per arch from a matrix in
# nightly.yml / release.yml.
#
# Every component the `final` job needs is published as its own image by its own
# job, so `final` itself only pulls images and installs wheels -- it compiles
# nothing. That is load-bearing, not incidental: a hosted runner does not have
# the disk for `final` to build any of these components itself on top of the
# ~10GB ROCm base it already has to pull.
#
# This exists because `needs` in GitHub Actions is job-level, not
# matrix-cell-level: if migraphx/ort/final were each their own matrixed job (as
# they used to be), `ort: needs: migraphx` would block on the ENTIRE migraphx
# matrix finishing before ANY ort cell starts, even though each ort cell only
# depends on its own arch's migraphx image. Wrapping the whole per-arch chain in
# one reusable workflow and matrixing THAT instead means each arch's chain runs
# on its own schedule, independent of every other arch.

on:
  workflow_call:
    inputs:
      arch:
        required: true
        type: string
      migraphx-ref:
        required: false
        type: string
        default: develop
      release-tag:
        required: false
        type: string
        default: ''
      pytorch-version:
        required: false
        type: string
        default: ''
      rocm-release:
        required: false
        type: string
        default: ''
      base-image:
        required: false
        type: string
        default: ''
      use-prebuilt:
        required: false
        type: boolean
        default: true
      ort-version:
        required: false
        type: string
        default: ''
      debug:
        required: false
        type: boolean
        default: false

jobs:
  # The legacy-GCN arch list is spelled out inline in four places below rather
  # than resolved once in a setup job: a job per arch to compute one boolean
  # would add 26 more jobs to a full nightly matrix, and concurrency slots are
  # the scarce resource here, not YAML lines. Keep it in sync with
  # LEGACY_GCN_ARCHES in docker-bake.hcl, which drives what the build itself
  # does; this only decides whether rocBLAS is worth its own job.
  #
  # gfx900/gfx906/gfx90c only: the only arches whose rocBLAS may be rebuilt from
  # source, and elsewhere that component is a no-op passthrough not worth
  # publishing a full ROCm tree for. Its own job because migraphx and pytorch
  # both build on top of it, and as separate jobs they'd otherwise each redo the
  # (Tensile-heavy, hours-long) rebuild.
  #
  # The job runs for these arches in BOTH modes; whether it actually rebuilds is
  # decided inside rocblas.sh against the real base image: release builds always
  # rebuild (AMD's stable bases ship no kernels for these arches), nightly builds
  # rebuild only when their own base lacks the kernels (the fallback is a
  # from-source build, never another version's kernels) -- so on a nightly whose
  # base does carry them (TheRock 10.x), this job is a fast passthrough.
  rocblas:
    if: ${{ contains(fromJSON('["gfx900","gfx906","gfx90c"]'), inputs.arch) }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-component.yml
    secrets: inherit
    with:
      arch: ${{ inputs.arch }}
      component: rocblas
      release-tag: ${{ inputs.release-tag }}
      rocm-release: ${{ inputs.rocm-release }}
      base-image: ${{ inputs.base-image }}
      debug: ${{ inputs.debug }}

  # On every non-legacy arch the rocblas job above is skipped, which GitHub
  # reports as result == 'skipped' rather than 'success' -- hence both being
  # accepted here. with-rocblas-image is likewise only true where an image was
  # actually published; elsewhere the bake graph keeps building the in-tree
  # passthrough target.
  migraphx:
    needs: rocblas
    if: ${{ !cancelled() && (needs.rocblas.result == 'success' || needs.rocblas.result == 'skipped') }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-component.yml
    secrets: inherit
    with:
      arch: ${{ inputs.arch }}
      component: migraphx
      with-rocblas-image: ${{ contains(fromJSON('["gfx900","gfx906","gfx90c"]'), inputs.arch) }}
      migraphx-ref: ${{ inputs.migraphx-ref }}
      release-tag: ${{ inputs.release-tag }}
      rocm-release: ${{ inputs.rocm-release }}
      base-image: ${{ inputs.base-image }}
      debug: ${{ inputs.debug }}

  pytorch:
    needs: rocblas
    if: ${{ !cancelled() && (needs.rocblas.result == 'success' || needs.rocblas.result == 'skipped') }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-component.yml
    secrets: inherit
    with:
      arch: ${{ inputs.arch }}
      component: pytorch
      with-rocblas-image: ${{ contains(fromJSON('["gfx900","gfx906","gfx90c"]'), inputs.arch) }}
      release-tag: ${{ inputs.release-tag }}
      base-image: ${{ inputs.base-image }}
      pytorch-version: ${{ inputs.pytorch-version }}
      rocm-release: ${{ inputs.rocm-release }}
      use-prebuilt: ${{ inputs.use-prebuilt }}
      debug: ${{ inputs.debug }}

  # torchvision and torchaudio each need a working torch to build and verify
  # against, so they hang off the pytorch job and consume its published image
  # rather than rebuilding it. As their own jobs they run on their own runners,
  # with their own disk, and `final` just pulls the results -- previously the
  # `final` job silently built both itself, which is what was exhausting its
  # disk.
  torchvision:
    needs: pytorch
    if: ${{ !cancelled() && needs.pytorch.result == 'success' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-component.yml
    secrets: inherit
    with:
      arch: ${{ inputs.arch }}
      component: torchvision
      with-rocblas-image: ${{ contains(fromJSON('["gfx900","gfx906","gfx90c"]'), inputs.arch) }}
      with-pytorch-image: true
      release-tag: ${{ inputs.release-tag }}
      base-image: ${{ inputs.base-image }}
      pytorch-version: ${{ inputs.pytorch-version }}
      rocm-release: ${{ inputs.rocm-release }}
      use-prebuilt: ${{ inputs.use-prebuilt }}
      debug: ${{ inputs.debug }}

  torchaudio:
    needs: pytorch
    if: ${{ !cancelled() && needs.pytorch.result == 'success' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-component.yml
    secrets: inherit
    with:
      arch: ${{ inputs.arch }}
      component: torchaudio
      with-rocblas-image: ${{ contains(fromJSON('["gfx900","gfx906","gfx90c"]'), inputs.arch) }}
      with-pytorch-image: true
      release-tag: ${{ inputs.release-tag }}
      base-image: ${{ inputs.base-image }}
      pytorch-version: ${{ inputs.pytorch-version }}
      rocm-release: ${{ inputs.rocm-release }}
      use-prebuilt: ${{ inputs.use-prebuilt }}
      debug: ${{ inputs.debug }}

  ort:
    needs: migraphx
    if: ${{ !cancelled() && needs.migraphx.result == 'success' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-component.yml
    secrets: inherit
    with:
      arch: ${{ inputs.arch }}
      component: ort
      with-migraphx-image: true
      migraphx-ref: ${{ inputs.migraphx-ref }}
      release-tag: ${{ inputs.release-tag }}
      rocm-release: ${{ inputs.rocm-release }}
      base-image: ${{ inputs.base-image }}
      ort-version: ${{ inputs.ort-version }}
      debug: ${{ inputs.debug }}

  final:
    needs: [pytorch, torchvision, torchaudio, ort]
    if: ${{ !cancelled() && needs.pytorch.result == 'success' && needs.torchvision.result == 'success' && needs.torchaudio.result == 'success' && needs.ort.result == 'success' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-component.yml
    secrets: inherit
    with:
      arch: ${{ inputs.arch }}
      component: final
      # Every component this job needs arrives prebuilt, so it pulls images and
      # installs wheels and compiles nothing at all -- hence swap-size-gb: 0, the
      # swapfile being otherwise 16GB of the root disk this job kept running out
      # of.
      with-migraphx-image: true
      with-pytorch-image: true
      with-torchvision-image: true
      with-torchaudio-image: true
      with-ort-image: true
      swap-size-gb: 0
      migraphx-ref: ${{ inputs.migraphx-ref }}
      release-tag: ${{ inputs.release-tag }}
      base-image: ${{ inputs.base-image }}
      pytorch-version: ${{ inputs.pytorch-version }}
      rocm-release: ${{ inputs.rocm-release }}
      use-prebuilt: ${{ inputs.use-prebuilt }}
      ort-version: ${{ inputs.ort-version }}
      debug: ${{ inputs.debug }}
