name: Build pipeline (single arch)

# Runs the full [rocblas ->] migraphx -> ort -> final chain for ONE arch, plus
# the parallel [rocblas ->] pytorch -> {torchvision, torchaudio} -> final chain,
# which is independent of MIGraphX. Called once per arch from a matrix in
# nightly.yml. The rocblas job only exists for gfx900/gfx906/gfx90c.
#
# Every component the `final` job needs is published as its own image by its own
# job, so `final` itself only pulls images and installs wheels -- it compiles
# nothing. That is load-bearing, not incidental: a hosted runner does not have
# the disk for `final` to build any of these stages itself on top of the
# ~10GB ROCm base it already has to pull.
#
# This exists because `needs` in GitHub Actions is job-level, not
# matrix-cell-level: if migraphx/ort/final were each their own matrixed job
# (as they used to be), `ort: needs: migraphx` would block on the ENTIRE
# migraphx matrix finishing before ANY ort cell starts, even though each ort
# cell only actually depends on its own arch's migraphx image. Wrapping the
# whole per-arch chain in one reusable workflow and matrixing THAT instead
# means each arch's migraphx/pytorch/ort/final run back-to-back on their own
# schedule, independent of every other arch.

on:
  workflow_call:
    inputs:
      arch:
        required: true
        type: string
      migraphx-ref:
        required: false
        type: string
        default: develop
      release-tag:
        required: false
        type: string
        default: ''
      pytorch-version:
        required: false
        type: string
        default: ''
      rocm-release:
        required: false
        type: string
        default: ''
      base-image:
        required: false
        type: string
        default: ''
      use-prebuilt:
        required: false
        type: boolean
        default: true
      ort-version:
        required: false
        type: string
        default: ''
      debug:
        required: false
        type: boolean
        default: false

jobs:
  # gfx900/gfx906/gfx90c only: they're the only arches the Dockerfile rebuilds
  # rocBLAS from source for, and elsewhere that stage is a no-op passthrough
  # not worth publishing a full ROCm tree for. Its own job because migraphx and
  # pytorch both build on top of it, and as separate jobs they'd otherwise each
  # redo the (Tensile-heavy, hours-long) rebuild.
  rocblas:
    if: ${{ inputs.arch == 'gfx900' || inputs.arch == 'gfx906' || inputs.arch == 'gfx90c' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-component.yml
    secrets: inherit
    with:
      arch: ${{ inputs.arch }}
      component: rocblas
      target: rocblas-builder
      release-tag: ${{ inputs.release-tag }}
      rocm-release: ${{ inputs.rocm-release }}
      base-image: ${{ inputs.base-image }}
      debug: ${{ inputs.debug }}

  # On every non-legacy arch the rocblas job above is skipped, which GitHub
  # reports as result == 'skipped' rather than 'success' -- hence both being
  # accepted here. with-rocblas-image is likewise only true where an image was
  # actually published; elsewhere the Dockerfile's ROCBLAS_IMAGE default keeps
  # resolving to the in-tree passthrough stage.
  migraphx:
    needs: rocblas
    if: ${{ !cancelled() && (needs.rocblas.result == 'success' || needs.rocblas.result == 'skipped') }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-component.yml
    secrets: inherit
    with:
      arch: ${{ inputs.arch }}
      component: migraphx
      target: migraphx-builder
      with-rocblas-image: ${{ inputs.arch == 'gfx900' || inputs.arch == 'gfx906' || inputs.arch == 'gfx90c' }}
      migraphx-ref: ${{ inputs.migraphx-ref }}
      release-tag: ${{ inputs.release-tag }}
      rocm-release: ${{ inputs.rocm-release }}
      base-image: ${{ inputs.base-image }}
      debug: ${{ inputs.debug }}

  pytorch:
    needs: rocblas
    if: ${{ !cancelled() && (needs.rocblas.result == 'success' || needs.rocblas.result == 'skipped') }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-component.yml
    secrets: inherit
    with:
      arch: ${{ inputs.arch }}
      component: pytorch
      target: pytorch-builder
      with-rocblas-image: ${{ inputs.arch == 'gfx900' || inputs.arch == 'gfx906' || inputs.arch == 'gfx90c' }}
      release-tag: ${{ inputs.release-tag }}
      base-image: ${{ inputs.base-image }}
      pytorch-version: ${{ inputs.pytorch-version }}
      rocm-release: ${{ inputs.rocm-release }}
      use-prebuilt: ${{ inputs.use-prebuilt }}
      debug: ${{ inputs.debug }}

  # torchvision and torchaudio each need a working torch to build/verify
  # against, so they hang off the pytorch job and consume its published image
  # rather than rebuilding it. They used to have no jobs at all: the Dockerfile
  # ARGs TORCHVISION_IMAGE/TORCHAUDIO_IMAGE were never passed by
  # build-component.yml, so their default (the in-tree stage name) won, and the
  # `final` job silently built BOTH stages itself -- two extra toolchain
  # installs, two more copies of the ~1.7GB torch wheel installed into throwaway
  # build venvs, and a second `pip download` of torch on top. That is what was
  # exhausting the runner's disk in the final component. As their own jobs they
  # run on their own runners, with their own disk, and `final` just pulls the
  # results.
  #
  # Matrixed per-arch like everything else even though torchaudio's wheel is
  # arch-independent (see the Dockerfile stage's own comment): the pipeline
  # itself is per-arch, and this is no more work than the per-arch rebuild that
  # was already happening inside `final`.
  torchvision:
    needs: pytorch
    if: ${{ !cancelled() && needs.pytorch.result == 'success' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-component.yml
    secrets: inherit
    with:
      arch: ${{ inputs.arch }}
      component: torchvision
      target: torchvision-builder
      with-rocblas-image: ${{ inputs.arch == 'gfx900' || inputs.arch == 'gfx906' || inputs.arch == 'gfx90c' }}
      with-pytorch-image: true
      release-tag: ${{ inputs.release-tag }}
      base-image: ${{ inputs.base-image }}
      pytorch-version: ${{ inputs.pytorch-version }}
      rocm-release: ${{ inputs.rocm-release }}
      use-prebuilt: ${{ inputs.use-prebuilt }}
      debug: ${{ inputs.debug }}

  torchaudio:
    needs: pytorch
    if: ${{ !cancelled() && needs.pytorch.result == 'success' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-component.yml
    secrets: inherit
    with:
      arch: ${{ inputs.arch }}
      component: torchaudio
      target: torchaudio-builder
      with-rocblas-image: ${{ inputs.arch == 'gfx900' || inputs.arch == 'gfx906' || inputs.arch == 'gfx90c' }}
      with-pytorch-image: true
      release-tag: ${{ inputs.release-tag }}
      base-image: ${{ inputs.base-image }}
      pytorch-version: ${{ inputs.pytorch-version }}
      rocm-release: ${{ inputs.rocm-release }}
      use-prebuilt: ${{ inputs.use-prebuilt }}
      debug: ${{ inputs.debug }}

  ort:
    needs: migraphx
    if: ${{ !cancelled() && needs.migraphx.result == 'success' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-component.yml
    secrets: inherit
    with:
      arch: ${{ inputs.arch }}
      component: ort
      target: ort-builder
      with-migraphx-image: true
      migraphx-ref: ${{ inputs.migraphx-ref }}
      release-tag: ${{ inputs.release-tag }}
      rocm-release: ${{ inputs.rocm-release }}
      base-image: ${{ inputs.base-image }}
      ort-version: ${{ inputs.ort-version }}
      debug: ${{ inputs.debug }}

  final:
    needs: [pytorch, torchvision, torchaudio, ort]
    if: ${{ !cancelled() && needs.pytorch.result == 'success' && needs.torchvision.result == 'success' && needs.torchaudio.result == 'success' && needs.ort.result == 'success' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-component.yml
    secrets: inherit
    with:
      arch: ${{ inputs.arch }}
      component: final
      final: true
      # Every component this stage needs arrives prebuilt -- with
      # torchvision/torchaudio now included, the job pulls images and installs
      # wheels and compiles nothing at all, hence swap-size-gb: 0 (see that
      # input's description: the swapfile is otherwise 16GB of the root disk
      # this stage kept running out of).
      with-migraphx-image: true
      with-pytorch-image: true
      with-torchvision-image: true
      with-torchaudio-image: true
      with-ort-image: true
      swap-size-gb: 0
      migraphx-ref: ${{ inputs.migraphx-ref }}
      release-tag: ${{ inputs.release-tag }}
      base-image: ${{ inputs.base-image }}
      pytorch-version: ${{ inputs.pytorch-version }}
      rocm-release: ${{ inputs.rocm-release }}
      use-prebuilt: ${{ inputs.use-prebuilt }}
      ort-version: ${{ inputs.ort-version }}
      debug: ${{ inputs.debug }}
