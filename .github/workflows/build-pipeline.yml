name: Build pipeline (single arch)

# Runs the full [rocblas ->] migraphx -> ort -> final chain (plus the pytorch
# build, which only depends on rocblas) for ONE arch. Called once per arch from
# a matrix in nightly.yml. The rocblas job only exists for gfx900/gfx906.
#
# This exists because `needs` in GitHub Actions is job-level, not
# matrix-cell-level: if migraphx/ort/final were each their own matrixed job
# (as they used to be), `ort: needs: migraphx` would block on the ENTIRE
# migraphx matrix finishing before ANY ort cell starts, even though each ort
# cell only actually depends on its own arch's migraphx image. Wrapping the
# whole per-arch chain in one reusable workflow and matrixing THAT instead
# means each arch's migraphx/pytorch/ort/final run back-to-back on their own
# schedule, independent of every other arch.

on:
  workflow_call:
    inputs:
      arch:
        required: true
        type: string
      migraphx-ref:
        required: false
        type: string
        default: develop
      debug:
        required: false
        type: boolean
        default: false

jobs:
  # gfx900/gfx906 only: they're the only arches the Dockerfile rebuilds rocBLAS
  # from source for, and elsewhere that stage is a no-op passthrough not worth
  # publishing a full ROCm tree for. Its own job because migraphx and pytorch
  # both build on top of it, and as separate jobs they'd otherwise each redo the
  # (Tensile-heavy, hours-long) rebuild.
  rocblas:
    if: ${{ inputs.arch == 'gfx900' || inputs.arch == 'gfx906' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-component.yml
    secrets: inherit
    with:
      arch: ${{ inputs.arch }}
      component: rocblas
      target: rocblas-builder
      debug: ${{ inputs.debug }}

  # On every non-legacy arch the rocblas job above is skipped, which GitHub
  # reports as result == 'skipped' rather than 'success' -- hence both being
  # accepted here. with-rocblas-image is likewise only true where an image was
  # actually published; elsewhere the Dockerfile's ROCBLAS_IMAGE default keeps
  # resolving to the in-tree passthrough stage.
  migraphx:
    needs: rocblas
    if: ${{ !cancelled() && (needs.rocblas.result == 'success' || needs.rocblas.result == 'skipped') }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-component.yml
    secrets: inherit
    with:
      arch: ${{ inputs.arch }}
      component: migraphx
      target: migraphx-builder
      with-rocblas-image: ${{ inputs.arch == 'gfx900' || inputs.arch == 'gfx906' }}
      migraphx-ref: ${{ inputs.migraphx-ref }}
      debug: ${{ inputs.debug }}

  pytorch:
    needs: rocblas
    if: ${{ !cancelled() && (needs.rocblas.result == 'success' || needs.rocblas.result == 'skipped') }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-component.yml
    secrets: inherit
    with:
      arch: ${{ inputs.arch }}
      component: pytorch
      target: pytorch-builder
      with-rocblas-image: ${{ inputs.arch == 'gfx900' || inputs.arch == 'gfx906' }}
      debug: ${{ inputs.debug }}

  ort:
    needs: migraphx
    if: ${{ !cancelled() && needs.migraphx.result == 'success' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-component.yml
    secrets: inherit
    with:
      arch: ${{ inputs.arch }}
      component: ort
      target: ort-builder
      with-migraphx-image: true
      migraphx-ref: ${{ inputs.migraphx-ref }}
      debug: ${{ inputs.debug }}

  final:
    needs: [pytorch, ort]
    if: ${{ !cancelled() && needs.pytorch.result == 'success' && needs.ort.result == 'success' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-component.yml
    secrets: inherit
    with:
      arch: ${{ inputs.arch }}
      component: final
      final: true
      with-migraphx-image: true
      with-pytorch-image: true
      with-ort-image: true
      migraphx-ref: ${{ inputs.migraphx-ref }}
      debug: ${{ inputs.debug }}
