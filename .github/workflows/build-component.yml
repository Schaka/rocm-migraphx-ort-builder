name: Build component

# Reusable single-component build. Called once per component per arch by
# build-pipeline.yml, so rocblas / migraphx / pytorch / torchvision / torchaudio
# / ort / final each run as their own job on their own fresh runner with their
# own 360-minute budget, instead of all racing a single 6h ceiling in one
# monolithic build. Each component pushes an image the jobs downstream of it
# consume as a build context, so no component recompiles another's work.
#
# This workflow deliberately contains no build logic: which Dockerfile a
# component uses, what it is tagged, where its cache lives and which sibling
# images it pulls from are all decided in docker-bake.hcl. Everything here is
# either a runner concern or a variable being handed to bake -- which also means
# `docker buildx bake <component>` locally reproduces exactly what CI does.

on:
  workflow_call:
    inputs:
      arch:
        description: 'Single gfx arch to build (e.g. gfx1201)'
        required: true
        type: string
      component:
        description: 'Bake target to build (rocblas|migraphx|pytorch|torchvision|torchaudio|ort|final)'
        required: true
        type: string
      with-rocblas-image:
        description: 'Start FROM the prebuilt rocBLAS image instead of rebuilding that component'
        required: false
        type: boolean
        default: false
      with-migraphx-image:
        description: 'Consume the prebuilt migraphx image instead of rebuilding it'
        required: false
        type: boolean
        default: false
      with-pytorch-image:
        description: 'Consume the prebuilt pytorch image instead of rebuilding it'
        required: false
        type: boolean
        default: false
      with-torchvision-image:
        description: 'Consume the prebuilt torchvision image instead of rebuilding it'
        required: false
        type: boolean
        default: false
      with-torchaudio-image:
        description: 'Consume the prebuilt torchaudio image instead of rebuilding it'
        required: false
        type: boolean
        default: false
      with-ort-image:
        description: 'Consume the prebuilt ort image instead of rebuilding it'
        required: false
        type: boolean
        default: false
      swap-size-gb:
        description: 'Swapfile size in GB; 0 skips it and reclaims the runner''s own swap (see the composite action)'
        required: false
        type: number
        default: 16
      migraphx-ref:
        description: 'Git ref to build MIGraphX from (branch/tag). "develop" (default) keeps the normal nightly tag scheme; any other ref suffixes the migraphx/ort/final image tags with it so a pinned build does not collide with the develop-tracking one.'
        required: false
        type: string
        default: develop
      release-tag:
        description: 'Set for a pinned release build (e.g. "rocm7.14"). Replaces the migraphx-ref-derived tag suffix with this exact string, and (for the final component) publishes a single "<release-tag>-<arch>" tag instead of the usual :latest-<arch>/:<date>-<arch> pair.'
        required: false
        type: string
        default: ''
      pytorch-version:
        description: 'PYTORCH_VERSION override (e.g. "v2.14.0"). Empty floats fully -- what nightly wants.'
        required: false
        type: string
        default: ''
      rocm-release:
        description: 'ROCM_RELEASE override (e.g. "7.14"). Empty = nightly-mode wheel discovery, and rocBLAS builds from rocm-libraries'' develop branch instead of a pinned therock-<release> tag.'
        required: false
        type: string
        default: ''
      base-image:
        description: 'BASE_IMAGE override. Empty keeps docker-bake.hcl''s default (our own nightly rocm-builder).'
        required: false
        type: string
        default: ''
      use-prebuilt:
        description: 'Try prebuilt AMD wheels for pytorch/torchvision/torchaudio first (true = 1, false = 0).'
        required: false
        type: boolean
        default: true
      ort-version:
        description: 'ORT_VERSION override (e.g. "v1.29.0"). Empty keeps docker-bake.hcl''s default.'
        required: false
        type: string
        default: ''
      debug:
        description: 'Open an SSH debug session (tmate) into the runner for the duration of the build'
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare runner
        uses: ./.github/actions/prepare-runner
        with:
          debug: ${{ inputs.debug }}
          swap-size-gb: ${{ inputs.swap-size-gb }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ inputs.component }}
        env:
          COMPONENT: ${{ inputs.component }}
          OWNER: ${{ github.repository_owner }}
          REGISTRY_CACHE: 'true'
          CACHE_TARGET: ${{ inputs.component }}
          ROCM_ARCH: ${{ inputs.arch }}
          BASE_IMAGE_IN: ${{ inputs.base-image }}
          ORT_VERSION_IN: ${{ inputs.ort-version }}
          MIGRAPHX_REF: ${{ inputs.migraphx-ref }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          # Emitted even when empty -- an explicit empty value is what makes
          # nightly float, instead of inheriting the pinned bake default.
          PYTORCH_VERSION: ${{ inputs.pytorch-version }}
          ROCM_RELEASE: ${{ inputs.rocm-release }}
          USE_PREBUILT: ${{ inputs.use-prebuilt && '1' || '0' }}
          WITH_ROCBLAS_IMAGE: ${{ inputs.with-rocblas-image }}
          WITH_MIGRAPHX_IMAGE: ${{ inputs.with-migraphx-image }}
          WITH_PYTORCH_IMAGE: ${{ inputs.with-pytorch-image }}
          WITH_TORCHVISION_IMAGE: ${{ inputs.with-torchvision-image }}
          WITH_TORCHAUDIO_IMAGE: ${{ inputs.with-torchaudio-image }}
          WITH_ORT_IMAGE: ${{ inputs.with-ort-image }}
        run: |
          set -euo pipefail
          # Lowercased: ghcr package paths are case-sensitive and always lower.
          export OWNER="${OWNER,,}"
          export DATE
          DATE="$(date -u +%Y%m%d)"
          export SOURCE_DATE="$DATE"

          # Empty inputs must NOT override a bake default that is meant to win
          # (unlike PYTORCH_VERSION/ROCM_RELEASE above, whose empty value is the
          # nightly-floats signal), so these two are only exported when set.
          if [ -n "$BASE_IMAGE_IN" ]; then export BASE_IMAGE="$BASE_IMAGE_IN"; fi
          if [ -n "$ORT_VERSION_IN" ]; then export ORT_VERSION="$ORT_VERSION_IN"; fi

          # Printed first so a failed build has the fully resolved graph -- tags,
          # contexts, args, cache refs -- right above it in the log.
          docker buildx bake --print "$COMPONENT"
          docker buildx bake --push "$COMPONENT"
