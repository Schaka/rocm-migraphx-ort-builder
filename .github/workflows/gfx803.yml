name: Build gfx803 (Polaris)

# Manual-only. There is deliberately no schedule: unlike the main nightly, every
# version in gfx803/Dockerfile is pinned to an immutable ref (ROCm 6.4.4,
# MIGraphX release/rocm-rel-6.4, a torch release branch, an ORT tag), so a
# nightly run would rebuild byte-identical inputs and republish the same image.
# Run it when a pin changes, or when something needs re-verifying on hardware.
#
# Chain: rocblas -> {migraphx, pytorch} -> ort -> final.
# rocBLAS has to come first because both MIGraphX and PyTorch link it and both
# need the gfx803 rebuild rather than the base image's gfx900+ copy. MIGraphX
# and PyTorch are independent of each other and run in parallel; ORT builds
# against MIGraphX's /opt/rocm; the final job assembles everything.
#
# Each component is individually skippable. These builds are long and the
# inputs rarely all change at once -- rocBLAS in particular only moves when
# ROCM_VERSION does, so re-running just the torch half after a PYTORCH_REF
# change shouldn't spend hours regenerating Tensile kernels. A skipped
# component's downstream jobs reuse whatever that component last published.

on:
  workflow_dispatch:
    inputs:
      build-rocblas:
        description: 'Build rocBLAS for gfx803 (uncheck to reuse the last published one)'
        type: boolean
        required: false
        default: true
      build-migraphx:
        description: 'Build MIGraphX'
        type: boolean
        required: false
        default: true
      build-pytorch:
        description: 'Build PyTorch + torchvision + torchaudio'
        type: boolean
        required: false
        default: true
      build-ort:
        description: 'Build ONNX Runtime'
        type: boolean
        required: false
        default: true
      pytorch-ref:
        description: 'Override PYTORCH_REF, e.g. release/2.6 (the hardware-verified gfx803 fallback). Leave empty for the Dockerfile default.'
        required: false
        default: ''
      torchvision-ref:
        description: 'Override TORCHVISION_REF, e.g. v0.21.0 to match torch 2.6. Leave empty for the Dockerfile default.'
        required: false
        default: ''
      torchaudio-ref:
        description: 'Override TORCHAUDIO_REF, e.g. v2.6.0 to match torch 2.6. Leave empty for the Dockerfile default.'
        required: false
        default: ''
      debug:
        description: 'Open an SSH debug session (tmate) into the runner for the duration of the build'
        type: boolean
        required: false
        default: false
      no-cache:
        description: 'Force a fully fresh build, ignoring the registry build cache (use if a component is suspected stale/corrupted)'
        type: boolean
        required: false
        default: false

jobs:
  rocblas:
    if: ${{ inputs.build-rocblas }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/gfx803-component.yml
    secrets: inherit
    with:
      component: rocblas
      target: rocblas-builder
      debug: ${{ inputs.debug }}
      no-cache: ${{ inputs.no-cache }}

  # `needs` + a skipped dependency: GitHub reports result == 'skipped', not
  # 'success', so every downstream gate has to accept both -- otherwise
  # unchecking build-rocblas would cascade into skipping the whole pipeline
  # instead of reusing the published rocBLAS image.
  migraphx:
    needs: rocblas
    if: ${{ !cancelled() && inputs.build-migraphx && (needs.rocblas.result == 'success' || needs.rocblas.result == 'skipped') }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/gfx803-component.yml
    secrets: inherit
    with:
      component: migraphx
      target: migraphx-builder
      with-rocblas-image: true
      debug: ${{ inputs.debug }}
      no-cache: ${{ inputs.no-cache }}

  pytorch:
    needs: rocblas
    if: ${{ !cancelled() && inputs.build-pytorch && (needs.rocblas.result == 'success' || needs.rocblas.result == 'skipped') }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/gfx803-component.yml
    secrets: inherit
    with:
      component: pytorch
      target: pytorch-builder
      with-rocblas-image: true
      pytorch-ref: ${{ inputs.pytorch-ref }}
      torchvision-ref: ${{ inputs.torchvision-ref }}
      torchaudio-ref: ${{ inputs.torchaudio-ref }}
      debug: ${{ inputs.debug }}
      no-cache: ${{ inputs.no-cache }}

  ort:
    needs: migraphx
    if: ${{ !cancelled() && inputs.build-ort && (needs.migraphx.result == 'success' || needs.migraphx.result == 'skipped') }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/gfx803-component.yml
    secrets: inherit
    with:
      component: ort
      target: ort-builder
      with-migraphx-image: true
      debug: ${{ inputs.debug }}
      no-cache: ${{ inputs.no-cache }}

  final:
    needs: [migraphx, pytorch, ort]
    if: ${{ !cancelled()
      && (needs.migraphx.result == 'success' || needs.migraphx.result == 'skipped')
      && (needs.pytorch.result == 'success' || needs.pytorch.result == 'skipped')
      && (needs.ort.result == 'success' || needs.ort.result == 'skipped') }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/gfx803-component.yml
    secrets: inherit
    with:
      component: final
      final: true
      with-migraphx-image: true
      with-pytorch-image: true
      with-ort-image: true
      debug: ${{ inputs.debug }}
      no-cache: ${{ inputs.no-cache }}
