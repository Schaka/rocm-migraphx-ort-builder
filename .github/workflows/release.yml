name: Release build

# Manually triggered ("Run workflow" in the Actions tab, or `gh workflow run
# release.yml -f ...`), NOT reactive to git tags -- a release build pins every
# moving part (BASE_IMAGE, ROCM_RELEASE, MIGraphX ref, PyTorch version, ORT
# version) to an immutable ROCm line via workflow inputs, no Dockerfile edit
# required.
#
# rocm_version's major.minor (e.g. "10.0" out of "10.0.0") drives:
#   - migraphx-ref: release/rocm-rel-<major.minor>, MIGraphX's own stable
#     branch for that ROCm line -- falling back to develop when the branch
#     doesn't exist yet (MIGraphX currently ships no release branch past 7.14).
#     The migraphx_ref input overrides this independently of rocm_version.
#   - release-tag: rocm<major.minor>, passed through build-pipeline.yml so
#     build-component.yml publishes a single immutable "rocm10.0-<arch>"
#     final tag instead of the develop-tracking :latest-<arch>/:<date>-<arch>
#     pair. Point downstream consumers at that tag for a stable, reproducible
#     build.
#   - rocm-release: same major.minor, passed as ROCM_RELEASE so pytorch's
#     wheel discovery AND rocblas's from-source rebuild (gfx900/906/90c) both
#     pin to this exact ROCm line instead of floating.
#
# Same per-arch fan-out as nightly.yml.
#
# Polaris (gfx803) is not part of this scheme -- ROCm 7 can't enumerate it at
# all, and even the ROCm 6.4.x line needs a different Dockerfile/build
# pipeline entirely. It's built and released from a separate repo,
# github.com/Schaka/rocm-gfx803, not from anything here.

on:
  workflow_dispatch:
    inputs:
      rocm_version:
        description: 'ROCm version to pin (X.Y.Z), matching a real rocm/dev-ubuntu-26.04 tag. Drives BASE_IMAGE, ROCM_RELEASE, and (unless migraphx_ref below overrides it) MIGRAPHX_REF.'
        required: false
        default: '10.0.0'
      migraphx_ref:
        description: 'Git ref to build MIGraphX from (branch/tag). Leave empty to derive release/rocm-rel-<rocm_version major.minor> automatically, falling back to develop when that branch does not exist yet (MIGraphX has no release branch for ROCm 10 as of now); set explicitly (e.g. "develop") to track it independently of rocm_version.'
        required: false
        default: ''
      pytorch_version:
        description: 'PyTorch version to pin (X.Y.Z, no "v" prefix). Resolved in order: a clean stable release on repo.amd.com; failing that, a devreleases build (matched to this exact version and rocm_version, substituting only what AMD never gave a clean release, see rocm-devrelease-snapshot.py); failing that, a full source build. So a pin without a clean AMD release for this rocm_version still builds -- just via one of the fallback tiers instead of a stable wheel.'
        required: false
        default: '2.14.0'
      ort_version:
        description: 'ONNX Runtime git tag to build (e.g. "v1.29.0").'
        required: false
        default: 'v1.29.0'
      use_prebuilt:
        description: 'Try prebuilt AMD wheels for pytorch/torchvision/torchaudio first (falls back to source per-package if none match). Uncheck to force a full from-source build of all three.'
        type: boolean
        required: false
        default: true
      arch:
        description: 'Single gfx arch to build (e.g. gfx1201). Leave empty for the full matrix.'
        required: false
        default: ''
      debug:
        description: 'Open an SSH debug session (tmate) into the runner for the duration of the build'
        type: boolean
        required: false
        default: false

jobs:
  set-version:
    runs-on: ubuntu-latest
    outputs:
      migraphx-ref: ${{ steps.parse.outputs.migraphx-ref }}
      release-tag: ${{ steps.parse.outputs.release-tag }}
      base-image: ${{ steps.parse.outputs.base-image }}
      rocm-release: ${{ steps.parse.outputs.rocm-release }}
    steps:
      - name: Parse ROCm version into release tag and refs
        id: parse
        # Inputs arrive via env, not interpolated into the script body: a
        # ${{ inputs.* }} expansion is pasted in as literal text before bash ever
        # sees it, so a crafted dispatch input would run as code here.
        env:
          ROCM_VERSION: ${{ inputs.rocm_version }}
          MIGRAPHX_REF_INPUT: ${{ inputs.migraphx_ref }}
        run: |
          ver="$ROCM_VERSION"
          major_minor="$(echo "$ver" | sed -E 's/^([0-9]+\.[0-9]+).*/\1/')"
          if [ "$major_minor" = "$ver" ]; then
            echo "rocm_version '${ver}' doesn't match X.Y or X.Y.Z" >&2
            exit 1
          fi
          if [ -n "$MIGRAPHX_REF_INPUT" ]; then
            migraphx_ref="$MIGRAPHX_REF_INPUT"
          else
            migraphx_ref="release/rocm-rel-${major_minor}"
            # MIGraphX lags the ROCm release train: as of ROCm 10 it has no
            # release/rocm-rel-10.0 branch at all (latest is 7.14). Falling back
            # to develop here makes the default just work, and automatically
            # starts using the release branch the day upstream ships it -- an
            # explicit migraphx_ref input still wins over both.
            if ! git ls-remote --heads https://github.com/ROCm/AMDMIGraphX.git \
                    "${migraphx_ref}" | grep -q .; then
              echo "::warning::AMDMIGraphX has no ${migraphx_ref} branch; MIGraphX defaults to develop"
              migraphx_ref="develop"
            fi
          fi
          # One grouped redirect rather than five appends to the same file.
          {
            echo "migraphx-ref=${migraphx_ref}"
            echo "release-tag=rocm${major_minor}"
            echo "base-image=rocm/dev-ubuntu-26.04:${ver}-full"
            echo "rocm-release=${major_minor}"
          } >> "$GITHUB_OUTPUT"

  set-matrix:
    runs-on: ubuntu-latest
    outputs:
      arches: ${{ steps.m.outputs.arches }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        uses: ./.github/actions/arch-matrix
        with:
          arch: ${{ inputs.arch }}

  build:
    needs: [set-version, set-matrix]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.set-matrix.outputs.arches) }}
    uses: ./.github/workflows/build-pipeline.yml
    secrets: inherit
    with:
      arch: ${{ matrix.arch }}
      migraphx-ref: ${{ needs.set-version.outputs.migraphx-ref }}
      release-tag: ${{ needs.set-version.outputs.release-tag }}
      base-image: ${{ needs.set-version.outputs.base-image }}
      rocm-release: ${{ needs.set-version.outputs.rocm-release }}
      pytorch-version: v${{ inputs.pytorch_version }}
      use-prebuilt: ${{ inputs.use_prebuilt }}
      ort-version: ${{ inputs.ort_version }}
      debug: ${{ inputs.debug }}
