name: Resolve arch matrix
description: >-
  Turns an optional single-arch input into the JSON array the build matrix
  consumes. The supported-arch list lives here and nowhere else, so nightly and
  release builds can never drift apart on which GPUs they cover.

inputs:
  arch:
    description: 'Single gfx arch to build. Empty resolves to the full matrix.'
    required: false
    default: ''

outputs:
  arches:
    description: 'JSON array of gfx arches'
    value: ${{ steps.resolve.outputs.arches }}

runs:
  using: composite
  steps:
    - id: resolve
      shell: bash
      env:
        ARCH: ${{ inputs.arch }}
      run: |
        set -euo pipefail
        # gfx803 shares this pipeline's published packages but not its
        # Dockerfiles: it is built from gfx803/ on a ROCm 6.4.x base by
        # gfx803.yml, because ROCm 7 can't enumerate Polaris at all. Letting it
        # through here would build the ROCm 7 graph for it and overwrite the good
        # gfx803 tags with something that can't run.
        if [ "$ARCH" = "gfx803" ]; then
          echo "gfx803 is not built by this workflow -- run 'Build gfx803 (Polaris)' instead." >&2
          exit 1
        fi

        all='["gfx900","gfx90c","gfx906","gfx908","gfx90a","gfx942","gfx950",
              "gfx1010","gfx1011","gfx1012","gfx1030","gfx1031","gfx1032",
              "gfx1034","gfx1035","gfx1036","gfx1100","gfx1101","gfx1102",
              "gfx1103","gfx1150","gfx1151","gfx1152","gfx1153","gfx1200",
              "gfx1201"]'

        if [ -n "$ARCH" ]; then
          arches="$(jq -cn --arg a "$ARCH" '[$a]')"
        else
          arches="$(jq -c . <<<"$all")"
        fi
        echo "arches=$arches" >> "$GITHUB_OUTPUT"
        echo "Resolved arch matrix: $arches"
